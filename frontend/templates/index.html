{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BinWise AI - Waste Classifier</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        *{
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <header>
        <h1>BinWise AI Waste Classifier</h1>
        <p>Upload an image of waste to see which bin it belongs to!</p>
    </header>

    <main>
        <div>
            <input type="file" id="imageInput" accept="image/*">
            <button id="classifyBtn">Classify Image</button>
        </div>

        <div id="previewContainer" style="margin-top:20px;">
            <img id="imagePreview" src="" alt="Image Preview" width="250"
                 style="display:none; border:1px solid #ccc; padding:5px;">
        </div>

        <div id="result" style="margin-top:20px;">
            <p><strong>Bin:</strong> <span id="bin"></span></p>
            <p><strong>Category:</strong> <span id="category"></span></p>
            <p><strong>Explanation:</strong> <span id="explanation"></span></p>
            <p><strong>Confidence:</strong> <span id="confidence"></span></p>
        </div>
    </main>

    <footer style="margin-top:40px;">
        <p>&copy; 2026 BinWise AI</p>
    </footer>

    <!-- app.js must load before frontend_ui.js -->
    <script src="{% static 'js/app.js' %}"></script>
    <script src="{% static 'js/frontend_ui.js' %}"></script>
</body>
</html>
